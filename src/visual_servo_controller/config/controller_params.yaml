# Visual Servo Controller Parameters

controller:
  lambda: 0.5

  # Linear velocity gains
  k_v:
    x: 1.0
    y: 1.0
    z: 1.0

  # Angular velocity gains
  k_omega:
    x: 0.5
    y: 0.5
    z: 0.5

camera:
  focal_length: 554.0
  principal_point:
    u: 320.0
    v: 240.0
  image_size:
    width: 640
    height: 480

desired_position:
  u: 320.0
  v: 240.0

limits:
  max_linear_velocity: 2.0
  max_angular_velocity: 1.0
