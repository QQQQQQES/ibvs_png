# Target Detection Parameters

detection:
  threshold: 0.5
  min_area: 100
  max_area: 10000
  dilation_iterations: 2

# HSV color range for red target detection (adjust based on lighting)
hsv_low_range: [0, 123, 100]
hsv_high_range: [5, 255, 255]

# Kalman filter parameters
kalman_filter:
  process_variance: 0.0001      # 1e-4, smaller = trust model more
  measurement_variance: 0.05    # 5e-2, smaller = trust measurement more
  update_rate: 30.0             # Hz

# Image parameters
image:
  center_u: 320.0
  center_v: 240.0
  width: 640
  height: 480

feature_tracking:
  max_features: 100
  quality_level: 0.01
  min_distance: 10
  block_size: 3

depth_estimation:
  focal_length: 554
  baseline: 0.12
  min_depth: 0.5
  max_depth: 10.0
  use_depth_estimation: true

# Debug options
debug:
  enable_debug_image: true
  log_level: info  # debug, info, warn, error
